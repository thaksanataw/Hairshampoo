<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Hair Shampoo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific styles (order) */
    .order-form { max-width: 560px; margin-inline: auto; }
    .order-form .btn { margin-top: var(--space-3); }
    .field input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    .field input[type="number"]::-webkit-outer-spin-button,
    .field input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Hair Shampoo</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="text-center" style="margin-bottom: var(--space-5);">
        <h1 class="title-mark">สั่งซื้อสินค้า</h1>
        <p class="lead">กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ</p>
      </div>

      <form id="orderForm" class="order-form">
        <div class="field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" required>
        </div>

        <div class="field">
          <label for="items">รายการสินค้า</label>
          <textarea id="items" name="items" rows="2" required></textarea>
        </div>

        <div class="field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
        </div>

        <div class="field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn--accent btn--block">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 Hair Shampoo</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
