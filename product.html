<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สินค้าทั้งหมด | Hair Shampoo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific styles (products): filter buttons rendered by script.js */
    #filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
    }
    .filter-btn.is-active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--cream);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Hair Shampoo</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html" aria-current="page">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="text-center title-mark" style="margin-bottom: var(--space-5);">สินค้าทั้งหมด</h1>

      <div id="filter-bar" role="group" aria-label="กรองสินค้าตามสูตร"></div>

      <div id="product-list" class="grid grid--3" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 Hair Shampoo</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
